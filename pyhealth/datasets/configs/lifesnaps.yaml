version: "1.0"
tables:
  lifesnaps_hourly:
    file_path: "lifesnaps-hourly.csv"
    patient_id: "patient_id"
    timestamp: "timestamp"
    attributes:
      - "day"
      - "hour"
      - "steps"
      - "bpm"
      - "calories"
      - "distance"
      - "temperature"
  lifesnaps_daily:
    file_path: "lifesnaps-daily.csv"
    patient_id: "patient_id"
    timestamp: "day"
    attributes:
      - "day"
      - "minutes_in_default_zone_1"
      - "minutes_below_default_zone_1"
      - "minutes_in_default_zone_2"
      - "minutes_in_default_zone_3"
      - "age"
      - "gender"
      - "bmi"
      - "step_goal_label"
      - "entertainment"
      - "gym"
      - "home"
      - "home_office"
      - "other"
      - "outdoors"
      - "transit"
      - "work_school"
      - "activity_type"
      - "ipip_extraversion_category"
      - "ipip_agreeableness_category"
      - "ipip_conscientiousness_category"
      - "ipip_stability_category"
      - "ipip_intellect_category"
      - "stress_label"
